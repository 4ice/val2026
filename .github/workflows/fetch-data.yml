name: Hämta valresultat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hämta senaste resultat från val.se
        run: |
          mkdir -p data
          curl -fsS --retry 3 -o data/RD_P.json \
            https://resultat.val.se/data/resultat/val2026/RD_P.json
          python3 -c "import json; json.load(open('data/RD_P.json'))"
      - name: Committa om något ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/RD_P.json
          git diff --cached --quiet || { git commit -m "Uppdatera valresultat"; git push; }

# Registrerad om: nudge för att GitHub ska plocka upp workflowen
